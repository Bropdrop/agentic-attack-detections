title: Strix AI Pentest Agent CLI or Sandbox
id: f15a6887-4f5c-590b-bfe3-829a57781f3b
status: experimental
description: |
    Detects the Strix CLI starting a scan, the strix-agent package being installed, the ghcr.io/usestrix/strix-sandbox
    container being run, or the Caido proxy the sandbox starts with guest access.
references:
    - https://github.com/usestrix/strix
    - https://gambit.security/blog-posts/autonomous-ai-agents-online-retailers-25-a-company
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-21
tags:
    - attack.reconnaissance
    - attack.t1595.002
logsource:
    category: process_creation
detection:
    selection_cli:
        CommandLine|re: '(^|[/\\\s])strix(\.exe)?["'']?\s(.*\s)?(--target|-t|--target-list|--scan-mode|--resume)[\s=]'
    selection_install:
        # Install commands only: uv and pip also name strix-agent when they probe an installed copy's interpreter
        CommandLine|re: '((pip|pip3|pipx)\s+install|uv\s+(tool\s+install|tool\s+run|pip\s+install)|uvx)\s(.*\s)?[\"'']?strix-agent'
    selection_sandbox:
        CommandLine|contains: 'usestrix/strix-sandbox'
    selection_caido:
        CommandLine|contains|all:
            - 'caido-cli'
            - '--allow-guests'
    condition: 1 of selection_*
falsepositives:
    - Authorized tests with Strix
level: medium
