[metadata]
creation_date = "2026/11/20"
maturity = "development"
updated_date = "2026/11/22"

[rule]
author = ["ThreatDefence"]
description = """
A request, sign-in or cloud API call carried a user agent that names the ARTEX framework or a renamed build.
"""
from = "now-9m"
index = ["logs-*", "filebeat-*"]
language = "eql"
license = "MIT"
name = "ARTEX Agentic Attack Framework User Agent"
references = ["https://threatdefence.com/article/artex-agentic-attack-framework-detection-hunting"]
risk_score = 73
rule_id = "b3e702f7-98bd-5dac-a260-b75e2967c54f"
severity = "high"
tags = ["Threat: ARTEX", "Data Source: Multiple", "Use Case: Threat Detection"]
type = "eql"

query = '''
any where
  // EQL's : operator ignores case, so ScopeWeaver/1.0 and ARTEX-PENTEST/1.0 match. KQL wildcards on a keyword field do not.
  user_agent.original : ("*artex-readonly/*", "*artex-pentest/*", "*artex-audit/*", "*artex-verify/*", "*artex-spawn/*", "*artex-worker/*",
                         "*artex-enrich/*", "*artex-i21861-canary*", "*mozilla/5.0 (artex)*", "*artexverify/*", "*artex/1.0*", "*scopeweaver*", "*spa-api-recon*") or
  // ARTeX is an indicator only in this exact mixed case, so it uses like, which is case-sensitive.
  user_agent.original like "*ARTeX*"
'''

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1595"
name = "Active Scanning"
reference = "https://attack.mitre.org/techniques/T1595/"

[rule.threat.tactic]
id = "TA0043"
name = "Reconnaissance"
reference = "https://attack.mitre.org/tactics/TA0043/"

[[rule.threat]]
framework = "MITRE ATT&CK"

[[rule.threat.technique]]
id = "T1190"
name = "Exploit Public-Facing Application"
reference = "https://attack.mitre.org/techniques/T1190/"

[rule.threat.tactic]
id = "TA0001"
name = "Initial Access"
reference = "https://attack.mitre.org/tactics/TA0001/"
