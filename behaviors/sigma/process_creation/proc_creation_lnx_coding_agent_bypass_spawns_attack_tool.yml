title: AI Agent CLI Starts an Attack Tool
id: 88fc59b1-a5c1-5229-9753-e11f9a5c4fc0
status: experimental
description: |
    Detects an attack tool whose parent is an AI agent CLI or the shell Claude Code runs commands through
    (zsh -c source ~/.claude/shell-snapshots/... on Linux and macOS, the CLAUDE_CODE_SHELL_LAUNCHER_SCRIPT PowerShell
    launcher on Windows). Auto-approve flags are not part of the rule: staff use them too, and an agent can run an
    attack tool without one. Qwen Code, Kimi CLI, Codex and opencode start tools through a plain shell, which puts the
    agent one level above the parent, so this rule only sees them when they start the tool directly; the KQL hunt in
    behaviors/sentinel/hunting covers the grandparent. The model behind the agent does not matter.
references:
    - https://github.com/oritera/Cairn
    - https://github.com/QwenLM/qwen-code
    - https://github.com/MoonshotAI/kimi-cli
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-21
modified: 2026-11-22
tags:
    - attack.execution
    - attack.t1059
    - attack.discovery
    - attack.t1046
logsource:
    category: process_creation
detection:
    selection_tool:
        Image|endswith:
            - '/nmap'
            - '\nmap.exe'
            - '/naabu'
            - '\naabu.exe'
            - '/masscan'
            - '\masscan.exe'
            - '/nuclei'
            - '\nuclei.exe'
            - '/katana'
            - '\katana.exe'
            - '/dalfox'
            - '\dalfox.exe'
            - '/ffuf'
            - '\ffuf.exe'
            - '/gobuster'
            - '\gobuster.exe'
            - '/feroxbuster'
            - '\feroxbuster.exe'
            - '/sqlmap'
            - '\sqlmap.exe'
            - '/nikto'
            - '\nikto.exe'
            - '/wpscan'
            - '\wpscan.exe'
            - '/hydra'
            - '\hydra.exe'
            - '/kerbrute'
            - '\kerbrute.exe'
            - '/netexec'
            - '\netexec.exe'
            - '/nxc'
            - '\nxc.exe'
            - '/crackmapexec'
            - '\crackmapexec.exe'
            - '/bloodyAD'
            - '\bloodyAD.exe'
            - '/coercer'
            - '\coercer.exe'
            - '/chisel'
            - '\chisel.exe'
            - '/evil-winrm'
            - '\evil-winrm.exe'
            - '/cloudfox'
            - '\cloudfox.exe'
            - '/msfconsole'
            - '\msfconsole.exe'
    selection_agent_shell:
        ParentCommandLine|contains:
            - 'shell-snapshots'
            - 'CLAUDE_CODE_SHELL_LAUNCHER_SCRIPT'
            - '--provider cairn'
            - '/tmp/cairn-pi/'
    selection_agent_parent:
        ParentImage|endswith:
            - '/claude'
            - '\claude.exe'
            - '/codex'
            - '\codex.exe'
            - '/qwen'
            - '\qwen.exe'
            - '/kimi'
            - '\kimi.exe'
            - '/opencode'
            - '\opencode.exe'
            - '/hermes'
            - '\hermes.exe'
    condition: selection_tool and (selection_agent_shell or selection_agent_parent)
falsepositives:
    - Staff who use an AI agent for authorized security testing or network troubleshooting
level: medium
