title: Coding Agent CLI in Bypass Mode Starts an Attack Tool
id: 88fc59b1-a5c1-5229-9753-e11f9a5c4fc0
status: experimental
description: |
    Detects an attack tool started by a shell whose parent is Claude Code, Codex or Pi running with approval prompts
    disabled. Cairn starts every worker this way, and its local mode runs them on the host with the user's permissions.
references:
    - https://github.com/oritera/Cairn
    - https://github.com/ThreatDefence/agentic-attack-detections
author: ThreatDefence
date: 2026-11-21
tags:
    - attack.execution
    - attack.t1059
    - attack.discovery
    - attack.t1046
logsource:
    product: linux
    category: process_creation
detection:
    selection_tool:
        Image|endswith:
            - '/nmap'
            - '/naabu'
            - '/nuclei'
            - '/katana'
            - '/dalfox'
            - '/ffuf'
            - '/sqlmap'
            - '/nikto'
            - '/kerbrute'
            - '/netexec'
            - '/nxc'
            - '/bloodyAD'
            - '/coercer'
            - '/chisel'
            - '/cloudfox'
    selection_parent:
        ParentCommandLine|contains:
            - '--dangerously-skip-permissions'
            - '--dangerously-bypass-approvals-and-sandbox'
            - '--provider cairn'
    condition: all of selection_*
falsepositives:
    - Developers who use coding agents for authorized security testing
level: high
