id: d26760e9-6ec3-5eec-830b-5a20b884c956
name: Coding-agent CLI in bypass mode starts attack tools (Cairn worker pattern)
description: |
  Claude Code, Codex or Pi running with its approval prompts disabled (--dangerously-skip-permissions,
  --dangerously-bypass-approvals-and-sandbox, or Cairn's --provider cairn / model_provider="cairn") started a scanner, a
  Kerberos or SMB attack tool or an exploit kit. Cairn launches every worker this way (dispatcher/workers/adapters), and its
  local mode runs them on the host with the user's own permissions. Any agent doing this is worth a look.
  Agentic attack detections by ThreatDefence (cross-framework behavior, first written for Cairn): https://github.com/ThreatDefence/agentic-attack-detections
severity: High
requiredDataConnectors:
  - connectorId: MicrosoftThreatProtection
    dataTypes: []
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Execution
  - Discovery
  - CredentialAccess
relevantTechniques:
  - T1059
  - T1046
  - T1110
query: |
  let AttackTools = dynamic(["nmap", "naabu", "nuclei", "katana", "dalfox", "ffuf", "gobuster", "dirsearch", "nikto", "sqlmap", "wpscan", "hydra", "kerbrute", "netexec", "nxc", "crackmapexec", "bloodyad", "coercer", "enum4linux-ng", "chisel", "pwncat", "evil-winrm", "cloudfox", "msfconsole"]);
  let Agents = DeviceProcessEvents
      | where ProcessCommandLine contains "--dangerously-skip-permissions" or ProcessCommandLine contains "--dangerously-bypass-approvals-and-sandbox"
          or ProcessCommandLine contains "model_provider=\"cairn\"" or ProcessCommandLine contains "--provider cairn"
      | project DeviceId, AgentPid=ProcessId, AgentTime=TimeGenerated, AgentCmd=substring(ProcessCommandLine, 0, 300);
  DeviceProcessEvents
  | where tolower(FileName) in (AttackTools) or ProcessCommandLine has_any ("impacket-", "ysoserial", "jwt_tool")
  | join kind=inner Agents on DeviceId
  | where TimeGenerated between (AgentTime .. (AgentTime + 2h)) and (InitiatingProcessParentId == AgentPid or InitiatingProcessId == AgentPid)
  | summarize Tools=make_set(FileName, 20), Commands=make_set(substring(ProcessCommandLine, 0, 200), 10), FirstSeen=min(TimeGenerated) by DeviceName, AccountName, AgentCmd
version: 1.0.0
kind: Scheduled
